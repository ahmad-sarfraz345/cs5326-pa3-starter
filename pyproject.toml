[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cs5326-pa3"
version = "1.0.0"
description = "CS 5326 Programming Assignment 3: Search over Reasoning"
authors = [{ name = "Muhammad Ahmad Sarfraz" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "transformers==4.45.2",
    "bitsandbytes==0.44.1",
    "accelerate==0.34.2",
    "datasets==3.0.1",
    "pytest==8.3.3",
    "tqdm",
    "numpy",
    "tabulate",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
