[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cs5326-pa3"
version = "1.0.0"
description = "CS 5326 Programming Assignment 3: Search over Reasoning"
authors = [{ name = "Muhammad Ahmad Sarfraz" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "transformers>=4.44.0",
    "bitsandbytes>=0.43.0",
    "accelerate>=0.33.0",
    "pytest>=8.0",
    "tqdm",
    "numpy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

